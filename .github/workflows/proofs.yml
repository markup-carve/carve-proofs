name: Proofs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run timing benchmarks and upload raw measurements
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14.2'
      - name: Install proof compiler and standard library
        run: opam install --yes rocq-core.9.2.0 rocq-stdlib.9.1.0 dune.3.23.1
      - name: Use HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Record property observations
        run: npm run check:properties -- --check-artifact reports/property-results.json --output reports/property-ci.json
      - name: Check three-reader comparison
        run: npm run check:comparison -- --check reports/comparison-results.json --output reports/comparison-ci.json
      - name: Check pinned djot.v package
        run: |
          npm run build:djot-v
          npm run check:djot-v -- --check reports/djot-v-results.json
          npm run check:djot-extensions -- --check reports/djot-extension-results.json
          npm run proof:djot-extensions -- --check reports/djot-extension-proofs.json
          npm run build:djot-differential
          npm run check:djot-differential -- --check reports/djot-differential.json --diagnostic-output reports/djot-differential-ci.json
          npm run proof:djot-differential -- --check reports/djot-differential-proofs.json
          npm run report:djot-differential
          git diff --exit-code -- reports/djot-differential.md
          npm run report:djot-v
          git diff --exit-code -- reports/djot-v.md
      - name: Check comparison and profiling reports
        run: |
          npm run report:comparison
          npm run report:profiling
          git diff --exit-code -- reports/comparison.md reports/nesting-profile.md
      - name: Check committed report
        run: |
          npm run report:properties
          git diff --exit-code -- reports/properties.md
      - name: Check model proofs and recorded evidence
        run: opam exec -- npm run proof:layout
      - name: Measure parser scaling
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: npm run bench:scaling -- reports/scaling-ci.json
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-observations
          path: |
            reports/property-ci.json
            reports/comparison-ci.json
            reports/djot-differential-ci.json
      - name: Upload benchmark measurements
        if: always() && github.event_name == 'workflow_dispatch' && inputs.benchmark
        uses: actions/upload-artifact@v4
        with:
          name: scaling-measurements
          path: reports/scaling-ci.json
          if-no-files-found: error
